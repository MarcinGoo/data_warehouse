services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dw_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./datasets:/datasets
    restart: unless-stopped

volumes:
  sqlserver_data:
